[project]
name = "strobes-mcp"
version = "0.2.0"
description = "MCP server for Strobes: search and triage findings, manage assets and engagements from Claude Code, Cursor, Codex or any MCP host. Browser sign-in shared with the Strobes CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Strobes", email = "support@strobes.co" }]
license = { text = "GPL-3.0-or-later" }
keywords = ["mcp", "model-context-protocol", "strobes", "vulnerability-management", "asm", "security", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://strobes.co"
Repository = "https://github.com/strobes-co/strobes-mcp"

[project.scripts]
strobes-mcp = "strobes_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strobes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
